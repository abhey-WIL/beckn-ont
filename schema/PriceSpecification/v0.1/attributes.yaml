openapi: 3.1.1
$id: https://schema.beckn.io/PriceSpecification/v0.1/attributes.yaml
info:
  title: PriceSpecification
  version: 0.1.0
  description: Price and payment attributes carried in considerationAttributes across
    all booking phases. Covers the total price, per-night rate, payment schedule,
    selected payment method, PSP gateway details, payment authorisation record, and
    escrow status. Also carries cancellation charge and refund amount in the cancellation
    flow.
components:
  schemas:
    PriceSpecification:
      type: object
      x-beckn-container: considerationAttributes
      x-status: draft
      x-tags:
      - hotel-booking
      - ont
      - pricing
      - payment
      x-jsonld:
        '@context': https://schema.beckn.io/PriceSpecification/v0.1/context.jsonld
        '@type': ps:PriceSpecification
      description: Price and payment attributes carried in considerationAttributes
        across all booking phases. Covers the total price, per-night rate, payment
        schedule, selected payment method, PSP gateway details, payment authorisation
        record, and escrow status. Also carries cancellation charge and refund amount
        in the cancellation flow.
      properties:
        price:
          type: number
          description: Total price for the consideration.
        priceCurrency:
          type: string
          description: ISO 4217 currency code.
        description:
          type: string
          description: Human-readable price description.
        valueAddedTaxIncluded:
          type: boolean
          description: Whether VAT/GST is included in the stated price.
        nightlyRate:
          type: number
          description: Per-night rate (for single-room bookings).
        paymentSchedule:
          type: string
          enum:
          - UPFRONT
          - AT_PROPERTY
          - INSTALMENT
          description: When payment is collected.
        acceptedPaymentMethods:
          type: array
          items:
            type: string
            enum:
            - CREDIT_CARD
            - DEBIT_CARD
            - BANK_TRANSFER
            - PSP_TOKEN
            - WALLET
          description: Payment methods accepted by the PN for this booking.
        selectedPaymentMethod:
          type: string
          enum:
          - CREDIT_CARD
          - DEBIT_CARD
          - BANK_TRANSFER
          - PSP_TOKEN
          - WALLET
          description: Payment method chosen by the CN.
        paymentGatewayUrl:
          type: string
          format: uri
          description: PSP checkout URL returned in on_init for the CN to redirect
            the traveller.
        paymentReference:
          type: string
          description: Payment intent or session reference from the PSP.
        paymentDeadline:
          type: string
          format: date-time
          description: Deadline by which payment must be completed to hold the booking.
        transactionRef:
          type: string
          description: PSP transaction reference after successful payment.
        paymentAuthorisation:
          type: object
          properties:
            authCode:
              type: string
            authProvider:
              type: string
            authTimestamp:
              type: string
              format: date-time
            authAmount:
              type: number
            authCurrency:
              type: string
          required:
          - authCode
          - authProvider
          - authTimestamp
          description: Payment authorisation record from the PSP (present in confirm).
        settled:
          type: boolean
          description: Whether the escrow has been settled to the supplier.
        escrowStatus:
          type: string
          enum:
          - HELD
          - RELEASED_TO_SUPPLIER
          - RELEASED_TO_BOOKER
          - DISPUTED
        escrowReference:
          type: string
          description: Finternet escrow reference for this consideration.
        cancellationCharge:
          type: object
          properties: &id001
            amount:
              type: number
            currency:
              type: string
              description: ISO 4217 currency code
          required: &id002
          - amount
          - currency
          description: Charge applied on cancellation (0 if within free window).
        refundAmount:
          type: object
          properties: *id001
          required: *id002
          description: Amount to be refunded to the booker on cancellation.
        refundTimeline:
          type: string
          description: Human-readable refund processing timeline.
      required:
      - price
      - priceCurrency
