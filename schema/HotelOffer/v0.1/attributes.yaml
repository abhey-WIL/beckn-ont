openapi: 3.1.1
$id: https://schema.beckn.io/HotelOffer/v0.1/attributes.yaml
info:
  title: HotelOffer
  version: 0.1.0
  description: Offer-level attributes for a specific room-rate combination returned
    in hotel discovery and pre-commit responses. Carries the rate plan, room category,
    meal basis, refundability, total price with nightly breakup, indicative cancellation
    windows, and the search-session binding that keeps the offer valid for 20 minutes.
components:
  schemas:
    HotelOffer:
      type: object
      x-beckn-container: offerAttributes
      x-status: draft
      x-tags:
      - hotel-booking
      - ont
      - offer
      x-jsonld:
        '@context': https://schema.beckn.io/HotelOffer/v0.1/context.jsonld
        '@type': ho:HotelOffer
      description: Offer-level attributes for a specific room-rate combination returned
        in hotel discovery and pre-commit responses. Carries the rate plan, room category,
        meal basis, refundability, total price with nightly breakup, indicative cancellation
        windows, and the search-session binding that keeps the offer valid for 20
        minutes.
      properties:
        ratePlanCode:
          type: string
          description: Provider-platform rate plan code.
        roomCategory:
          type: string
          description: Human-readable room category label.
        bedType:
          type: string
          description: Bed configuration description.
        maxOccupancy:
          type: object
          properties:
            adults:
              type: integer
              minimum: 1
            children:
              type: integer
              minimum: 0
          required:
          - adults
          description: Maximum occupancy for this room type.
        mealBasis:
          type: object
          properties:
            code:
              type: string
              description: Industry meal-basis code (e.g. BB, HB, AI).
            description:
              type: string
          required:
          - code
          description: Meal inclusion for this rate.
        refundable:
          type: boolean
          description: True if the rate allows free cancellation within at least one
            window.
        totalPrice:
          type: object
          properties: &id001
            amount:
              type: number
            currency:
              type: string
              description: ISO 4217 currency code
          required: &id002
          - amount
          - currency
          description: Total price for the stay in the requested currency.
        nightlyBreakup:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              price: &id003
                type: object
                properties: *id001
                required: *id002
            required:
            - date
            - price
          description: Per-night price breakdown.
        indicativeCancellationWindows:
          type: array
          items:
            type: object
            properties:
              startDatetime:
                type: string
                format: date-time
              endDatetime:
                type: string
                format: date-time
              charge: *id003
              description:
                type: string
            required:
            - startDatetime
            - endDatetime
            - charge
          description: Indicative (not binding) cancellation charge windows shown
            at discovery. Binding policy is confirmed at the select (pre-commit) stage.
        sessionIdentifier:
          type: string
          description: Search-session ID tying this offer to the originating discover
            request.
        sessionExpiresAt:
          type: string
          format: date-time
          description: Expiry of the search session (typically 20 minutes after discover).
      required:
      - ratePlanCode
      - roomCategory
      - mealBasis
      - refundable
      - totalPrice
