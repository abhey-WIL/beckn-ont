openapi: 3.1.1
$id: https://schema.beckn.io/HotelSearchIntent/v0.1/attributes.yaml
info:
  title: HotelSearchIntent
  version: 0.1.0
  description: Search-session context carried in the select request. Binds the chosen
    offer to the originating search parameters (stay dates, room/party configuration,
    nationality, country of residence, currency) and the session identifier, so the
    PN can validate that the pre-commit re-check is within the valid 20-minute search
    window.
components:
  schemas:
    HotelSearchIntent:
      type: object
      x-beckn-container: contractAttributes
      x-status: draft
      x-tags:
      - hotel-booking
      - ont
      - select
      x-jsonld:
        '@context': https://schema.beckn.io/HotelSearchIntent/v0.1/context.jsonld
        '@type': hsi:HotelSearchIntent
      description: Search-session context carried in the select request. Binds the
        chosen offer to the originating search parameters (stay dates, room/party
        configuration, nationality, country of residence, currency) and the session
        identifier, so the PN can validate that the pre-commit re-check is within
        the valid 20-minute search window.
      properties:
        searchSession:
          type: object
          properties:
            id:
              type: string
            expiresAt:
              type: string
              format: date-time
          required:
          - id
          - expiresAt
          description: Search session binding — must match the session from on_discover.
        stay:
          type: object
          properties:
            checkIn:
              type: string
              format: date
            checkOut:
              type: string
              format: date
            nights:
              type: integer
              minimum: 1
          required:
          - checkIn
          - checkOut
          description: Stay dates.
        rooms:
          type: array
          items:
            type: object
            properties:
              adults:
                type: integer
                minimum: 1
              children:
                type: integer
                minimum: 0
              childAges:
                type: array
                items:
                  type: integer
                  minimum: 0
                  maximum: 17
            required:
            - adults
          minItems: 1
          description: Per-room party configuration with child ages.
        nationality:
          type: object
          properties:
            code:
              type: string
              description: ISO 3166-1 alpha-2.
            name:
              type: string
          required:
          - code
          description: Nationality of the lead guest — affects rate eligibility.
        countryOfResidence:
          type: object
          properties:
            code:
              type: string
              description: ISO 3166-1 alpha-2.
            name:
              type: string
          required:
          - code
          description: Country of residence — affects rate eligibility and tax calculation.
        currency:
          type: string
          description: ISO 4217 currency code in which the traveller wants to pay.
      required:
      - searchSession
      - stay
      - rooms
