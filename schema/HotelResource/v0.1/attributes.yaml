openapi: 3.1.1
$id: https://schema.beckn.io/HotelResource/v0.1/attributes.yaml
info:
  title: HotelResource
  version: 0.1.0
  description: Room-level resource attributes for a hotel property on the ONT network.
    Each resource represents one room type published by the PN (OTRAMS) via catalog/publish
    and returned in on_discover responses. Hotel-level context (address, star rating,
    amenities) is denormalized into each room resource for self-contained discoverability.
    Contains no PII and no live availability data.
components:
  schemas:
    HotelResource:
      type: object
      x-beckn-container: resourceAttributes
      x-status: draft
      x-tags:
      - hotel-booking
      - ont
      - resource
      x-jsonld:
        '@context': https://schema.beckn.io/HotelResource/v0.1/context.jsonld
        '@type': hr:HotelResource
      description: Room-level resource attributes for a hotel property on the ONT
        network. Hotel-level context is denormalized into each room for self-contained
        discoverability.
      properties:
        name:
          type: string
          description: Display name of the room resource (mirrors roomCategory, used for generic name-based lookups).
        roomCategory:
          type: string
          description: Room type label (e.g. Deluxe Family Room, Standard Twin).
        bedType:
          type: string
          description: Bed configuration in the room (e.g. 1 King Bed + 1 Sofa Bed).
        maxOccupancy:
          type: object
          description: Maximum number of guests the room can accommodate.
          properties:
            adults:
              type: integer
              minimum: 1
            children:
              type: integer
              minimum: 0
          required:
          - adults
        roomAmenities:
          type: array
          items:
            type: string
          description: Room-level amenity labels (e.g. Free WiFi, Minibar, Safe).
        images:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - ROOM
                - THUMBNAIL
                - AMENITY
              url:
                type: string
                format: uri
            required:
            - type
            - url
          description: Room images by type.
        hotelId:
          type: string
          description: Provider-platform hotel identifier (e.g. OTRAMS hotel code).
        staticId:
          type: string
          description: Stable network-level property identity, referenced across transactions.
        hotelName:
          type: string
          description: Display name of the hotel property.
        starRating:
          type: integer
          minimum: 1
          maximum: 5
          description: Official star classification of the hotel (1–5).
        hotelAmenities:
          type: array
          items:
            type: string
          description: Hotel-level amenity labels (e.g. Swimming Pool, Spa, Restaurant).
      required:
      - name
      - roomCategory
      - bedType
      - hotelId
      - starRating
